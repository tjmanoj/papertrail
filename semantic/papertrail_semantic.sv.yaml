name: PAPERTRAIL_SEMANTIC
description: >-
  Governed risk and compliance semantic model for PaperTrail, a mid-size
  commercial bank regulated under AUSTRAC AML/CTF Act and MAS Notice 626.
  Covers AML transaction monitoring, counterparty risk exposure, alert
  management, investigation case lifecycle, and regulatory reporting.

  Every metric encodes a specific governance decision — which date basis to use,
  whether reversals and pending transactions are included, how denominators are
  scoped, and whether the measure is cohort-based or snapshot. These decisions
  are documented in each metric description so a compliance officer reading the
  semantic view understands WHY the number is what it is, not just what it is.

  Results are jurisdiction-scoped: an AU analyst sees AU-booked data, an SG
  analyst sees SG-booked data. All monetary values are in USD with no FX
  conversion applied.

tables:
  # ================================================================
  # DIM_COUNTERPARTY — counterparty dimension
  # ================================================================
  - name: DIM_COUNTERPARTY
    description: >-
      One row per counterparty (customer, corporate client, or correspondent
      bank). Includes current risk rating, KYC status, direct and entity-resolved
      balance exposure, and summary alert/case counts. Exposure uses
      average_monthly_balance of ACTIVE accounts only — dormant and closed
      accounts are excluded per concentration-risk policy.
    synonyms:
      - customer
      - client
      - entity
      - counterparties
      - customers
    base_table:
      database: PAPERTRAIL
      schema: GOLD
      table: DIM_COUNTERPARTY
    primary_key:
      columns:
        - COUNTERPARTY_ID
    dimensions:
      - name: COUNTERPARTY_ID
        expr: COUNTERPARTY_ID
        data_type: VARCHAR
        description: Stable internal identifier for the counterparty.
        unique: true
      - name: COUNTERPARTY_TYPE
        expr: COUNTERPARTY_TYPE
        data_type: VARCHAR
        description: "Legal classification: INDIVIDUAL, CORPORATE, or CORRESPONDENT_BANK."
        synonyms:
          - client type
          - entity type
      - name: FULL_LEGAL_NAME
        expr: FULL_LEGAL_NAME
        data_type: VARCHAR
        description: Counterparty name as on legal documents.
        synonyms:
          - name
          - counterparty name
          - client name
      - name: COUNTRY_OF_INCORPORATION
        expr: COUNTRY_OF_INCORPORATION
        data_type: VARCHAR
        description: ISO 3166-1 alpha-2 country code where the entity is incorporated. NULL for individuals.
      - name: COUNTRY_OF_RESIDENCE
        expr: COUNTRY_OF_RESIDENCE
        data_type: VARCHAR
        description: ISO 3166-1 alpha-2 country of residence. Applies to individuals only.
      - name: INDUSTRY_CODE
        expr: INDUSTRY_CODE
        data_type: VARCHAR
        description: ANZSIC division code classifying the counterparty business sector.
      - name: RISK_RATING
        expr: RISK_RATING
        data_type: VARCHAR
        description: "Current risk rating assigned at most recent assessment: LOW, MEDIUM, HIGH, or VERY_HIGH."
        synonyms:
          - risk level
          - risk tier
          - risk score
      - name: PEP_FLAG
        expr: PEP_FLAG
        data_type: BOOLEAN
        description: TRUE if the counterparty is a Politically Exposed Person. Triggers enhanced due diligence under AUSTRAC AML/CTF rules.
        synonyms:
          - politically exposed
          - PEP
      - name: SOURCE_OF_WEALTH
        expr: SOURCE_OF_WEALTH
        data_type: VARCHAR
        description: Declared source of wealth provided during onboarding KYC.
      - name: RELATIONSHIP_MANAGER_ID
        expr: RELATIONSHIP_MANAGER_ID
        data_type: VARCHAR
        description: Internal staff identifier of the assigned relationship manager.
      - name: JURISDICTION
        expr: JURISDICTION
        data_type: VARCHAR
        description: "Booking jurisdiction (AU or SG). Determines which compliance team has oversight and which regulatory regime applies."
        synonyms:
          - country
          - region
          - booking jurisdiction
      - name: IS_HIGH_RISK
        expr: IS_HIGH_RISK
        data_type: BOOLEAN
        description: "TRUE when risk_rating is HIGH or VERY_HIGH. This is the governed flag used by the high_risk_counterparty_count metric — it includes both HIGH and VERY_HIGH per KYC Refresh Policy section 2.1."
        synonyms:
          - high risk
          - elevated risk
      - name: IS_KYC_OVERDUE
        expr: IS_KYC_OVERDUE
        data_type: BOOLEAN
        description: TRUE if kyc_refresh_due_date is before today. Indicates the counterparty is overdue for a KYC review cycle.
        synonyms:
          - KYC overdue
          - overdue KYC
      - name: HAS_ACTIVE_ALERT
        expr: HAS_ACTIVE_ALERT
        data_type: BOOLEAN
        description: TRUE if the counterparty has at least one alert in OPEN or ESCALATED status.
      - name: HAS_OPEN_CASE
        expr: HAS_OPEN_CASE
        data_type: BOOLEAN
        description: TRUE if the counterparty has at least one investigation case in OPEN or UNDER_REVIEW status.
    time_dimensions:
      - name: ONBOARDING_DATE
        expr: ONBOARDING_DATE
        data_type: DATE
        description: Date the bank relationship began.
        synonyms:
          - customer since
          - start date
      - name: RISK_RATING_DATE
        expr: RISK_RATING_DATE
        data_type: TIMESTAMP_NTZ
        description: Timestamp of the most recent risk rating assessment.
      - name: KYC_REFRESH_DUE_DATE
        expr: KYC_REFRESH_DUE_DATE
        data_type: DATE
        description: Next mandatory KYC review due date. HIGH risk = annual, MEDIUM = biennial, LOW = triennial.
      - name: DATE_OF_BIRTH
        expr: DATE_OF_BIRTH
        data_type: DATE
        description: Date of birth for INDIVIDUAL counterparties. NULL for corporates and correspondent banks.
    facts:
      - name: DIRECT_EXPOSURE_USD
        expr: DIRECT_EXPOSURE_USD
        data_type: NUMBER
        description: >-
          Sum of average_monthly_balance across directly owned ACTIVE accounts only.
          Dormant and closed accounts are excluded. No FX conversion — all values are USD.
        synonyms:
          - direct balance
          - direct exposure
        default_aggregation: sum
      - name: RESOLVED_EXPOSURE_USD
        expr: RESOLVED_EXPOSURE_USD
        data_type: NUMBER
        description: >-
          Entity-resolved exposure: direct_exposure_usd plus the balance of ACTIVE
          accounts held by corporates where this counterparty is a beneficial owner
          (via CURATED.ENTITY_LINK). This is the governed measure for
          counterparty_exposure_usd — it captures beneficial ownership that direct
          exposure misses, preventing concentration-limit breaches from going undetected.
        synonyms:
          - total exposure
          - counterparty exposure
          - exposure
          - resolved balance
        default_aggregation: sum
      - name: ACTIVE_ACCOUNT_COUNT
        expr: ACTIVE_ACCOUNT_COUNT
        data_type: NUMBER
        description: Number of accounts in ACTIVE status owned by this counterparty.
        default_aggregation: sum
      - name: TOTAL_ACCOUNT_COUNT
        expr: TOTAL_ACCOUNT_COUNT
        data_type: NUMBER
        description: Total number of accounts (all statuses) owned by this counterparty.
        default_aggregation: sum
      - name: DAYS_SINCE_RISK_ASSESSMENT
        expr: DAYS_SINCE_RISK_ASSESSMENT
        data_type: NUMBER
        description: Calendar days since the most recent risk rating assessment.
        default_aggregation: avg
      - name: TOTAL_ALERTS
        expr: TOTAL_ALERTS
        data_type: NUMBER
        description: Total number of alerts ever raised against this counterparty.
        default_aggregation: sum
      - name: OPEN_ALERTS
        expr: OPEN_ALERTS
        data_type: NUMBER
        description: Number of alerts currently in OPEN status for this counterparty.
        default_aggregation: sum
      - name: ESCALATED_ALERTS
        expr: ESCALATED_ALERTS
        data_type: NUMBER
        description: Number of alerts currently in ESCALATED status for this counterparty.
        default_aggregation: sum
      - name: TOTAL_CASES
        expr: TOTAL_CASES
        data_type: NUMBER
        description: Total investigation cases ever opened for this counterparty.
        default_aggregation: sum
      - name: OPEN_CASES
        expr: OPEN_CASES
        data_type: NUMBER
        description: Investigation cases currently in OPEN or UNDER_REVIEW status.
        default_aggregation: sum
    metrics:
      - name: HIGH_RISK_COUNTERPARTY_COUNT
        expr: "COUNT(CASE WHEN IS_HIGH_RISK = TRUE THEN 1 END)"
        data_type: NUMBER
        description: >-
          Count of counterparties currently rated HIGH or VERY_HIGH.
          Governance decision: uses the current risk_rating regardless of when it was
          last assessed. Includes all counterparties in scope (even those with only
          dormant accounts) because a counterparty relationship exists until formally
          exited. Stale ratings assessed more than 12 months ago are still counted —
          the is_kyc_overdue flag separately identifies these for remediation rather
          than silently excluding them from the risk population.
          Regulatory basis: KYC Refresh Policy section 2.1 — count drives resource
          planning for annual KYC reviews.
        synonyms:
          - high risk count
          - risky counterparties
          - high risk counterparty count
          - number of high risk counterparties
        default_aggregation: sum
      - name: COUNTERPARTY_EXPOSURE_USD
        expr: "SUM(RESOLVED_EXPOSURE_USD)"
        data_type: NUMBER
        description: >-
          Net balance exposure across all ACTIVE accounts, including entity-resolved
          beneficial ownership positions. Governance decision: uses entity-resolved
          exposure (direct plus beneficial) not direct-only, because a compliance
          officer must see the full economic interest. Only ACTIVE accounts are
          included — dormant accounts are excluded per concentration-risk policy even
          though balances may remain. No loan-deposit netting: gross across all product
          types. No FX conversion applied — all values are USD.
          Regulatory basis: Risk Appetite Statement section 2.4 — concentration limits.
        synonyms:
          - total exposure
          - exposure
          - balance
        default_aggregation: sum

  # ================================================================
  # DIM_ACCOUNT — account dimension
  # ================================================================
  - name: DIM_ACCOUNT
    description: >-
      One row per account (savings, current, term deposit, loan, nostro, vostro).
      Includes account status, balance, and denormalized counterparty context for
      drill-through from counterparty exposure analysis.
    synonyms:
      - account
      - accounts
    base_table:
      database: PAPERTRAIL
      schema: GOLD
      table: DIM_ACCOUNT
    primary_key:
      columns:
        - ACCOUNT_ID
    dimensions:
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        data_type: VARCHAR
        description: Unique account identifier.
        unique: true
      - name: COUNTERPARTY_ID
        expr: COUNTERPARTY_ID
        data_type: VARCHAR
        description: FK to the counterparty who owns this account.
      - name: ACCOUNT_TYPE
        expr: ACCOUNT_TYPE
        data_type: VARCHAR
        description: "Product type: SAVINGS, CURRENT, TERM_DEPOSIT, LOAN, NOSTRO, or VOSTRO."
        synonyms:
          - product type
          - account product
      - name: CURRENCY_CODE
        expr: CURRENCY_CODE
        data_type: VARCHAR
        description: ISO 4217 currency code (all USD in this dataset).
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
        description: "Account lifecycle status: ACTIVE, DORMANT, CLOSED, or FROZEN."
        synonyms:
          - account status
      - name: BRANCH_CODE
        expr: BRANCH_CODE
        data_type: VARCHAR
        description: Branch that holds this account.
      - name: JURISDICTION
        expr: JURISDICTION
        data_type: VARCHAR
        description: Booking jurisdiction (AU or SG).
      - name: IS_ACTIVE
        expr: IS_ACTIVE
        data_type: BOOLEAN
        description: TRUE if account status is ACTIVE.
      - name: IS_DORMANT
        expr: IS_DORMANT
        data_type: BOOLEAN
        description: TRUE if account status is DORMANT (inactive for 12+ months).
      - name: COUNTERPARTY_NAME
        expr: COUNTERPARTY_NAME
        data_type: VARCHAR
        description: Denormalized counterparty legal name.
      - name: COUNTERPARTY_RISK_RATING
        expr: COUNTERPARTY_RISK_RATING
        data_type: VARCHAR
        description: Denormalized risk rating of the account owner.
    time_dimensions:
      - name: OPENED_DATE
        expr: OPENED_DATE
        data_type: DATE
        description: Date the account was opened.
      - name: CLOSED_DATE
        expr: CLOSED_DATE
        data_type: DATE
        description: Date the account was closed. NULL if still open.
    facts:
      - name: AVERAGE_MONTHLY_BALANCE_USD
        expr: AVERAGE_MONTHLY_BALANCE_USD
        data_type: NUMBER
        description: >-
          Rolling 3-month average balance in USD. This is the balance measure used
          for counterparty exposure calculations. Only meaningful for ACTIVE accounts.
        synonyms:
          - balance
          - account balance
        default_aggregation: sum
      - name: ACCOUNT_AGE_DAYS
        expr: ACCOUNT_AGE_DAYS
        data_type: NUMBER
        description: Calendar days since account opening.
        default_aggregation: avg

  # ================================================================
  # FACT_TRANSACTION — transaction fact
  # ================================================================
  - name: FACT_TRANSACTION
    description: >-
      One row per monetary transaction. Includes settlement status, reversal flags,
      cross-border indicators, structuring-band detection, and alert linkage.
      The governed date basis for this table is VALUE_DATE (settlement date), not
      BOOKING_DATE or TRANSACTION_TIMESTAMP — this prevents transactions booked at
      quarter-end but settled in the next quarter from appearing in the wrong
      reporting period.
    synonyms:
      - transaction
      - transactions
      - payments
      - transfers
    base_table:
      database: PAPERTRAIL
      schema: GOLD
      table: FACT_TRANSACTION
    primary_key:
      columns:
        - TRANSACTION_ID
    dimensions:
      - name: TRANSACTION_ID
        expr: TRANSACTION_ID
        data_type: VARCHAR
        description: Unique transaction identifier.
        unique: true
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        data_type: VARCHAR
        description: FK to the account on which this transaction occurred.
      - name: COUNTERPARTY_ID
        expr: COUNTERPARTY_ID
        data_type: VARCHAR
        description: FK to the counterparty who owns the transacting account.
      - name: TRANSACTION_TYPE
        expr: TRANSACTION_TYPE
        data_type: VARCHAR
        description: "Type of movement: WIRE_IN, WIRE_OUT, CASH_DEPOSIT, CASH_WITHDRAWAL, INTERNAL_TRANSFER, POS, ATM, FEE."
        synonyms:
          - type
          - payment type
      - name: ORIGINATOR_NAME
        expr: ORIGINATOR_NAME
        data_type: VARCHAR
        description: For incoming wires, the name of the sending party.
      - name: ORIGINATOR_COUNTRY
        expr: ORIGINATOR_COUNTRY
        data_type: VARCHAR
        description: ISO country code of the originator.
      - name: BENEFICIARY_NAME
        expr: BENEFICIARY_NAME
        data_type: VARCHAR
        description: For outgoing wires, the name of the receiving party.
      - name: BENEFICIARY_COUNTRY
        expr: BENEFICIARY_COUNTRY
        data_type: VARCHAR
        description: ISO country code of the beneficiary.
      - name: CHANNEL
        expr: CHANNEL
        data_type: VARCHAR
        description: "Transaction channel: BRANCH, ONLINE, MOBILE, or SWIFT."
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
        description: "Settlement status: SETTLED, PENDING, REVERSED, or FAILED."
        synonyms:
          - transaction status
      - name: IS_REVERSAL
        expr: IS_REVERSAL
        data_type: BOOLEAN
        description: >-
          TRUE if this transaction reverses a prior transaction. Reversals are
          excluded from suspicious volume calculations to avoid double-counting:
          the original transaction amount is sufficient evidence.
      - name: IS_SETTLED
        expr: IS_SETTLED
        data_type: BOOLEAN
        description: >-
          TRUE when status is SETTLED. The governed metrics use settled transactions
          only — pending transactions may never clear and should not inflate risk figures.
      - name: IS_CASH
        expr: IS_CASH
        data_type: BOOLEAN
        description: "TRUE for CASH_DEPOSIT or CASH_WITHDRAWAL. Used by structuring detection."
        synonyms:
          - cash transaction
      - name: IS_STRUCTURING_BAND
        expr: IS_STRUCTURING_BAND
        data_type: BOOLEAN
        description: >-
          TRUE when the transaction is a CASH_DEPOSIT with amount between $8,000 and
          $9,999 — the structuring detection band just below the $10,000 reporting
          threshold. This is the governed band definition; the structuring_indicator_score
          metric uses this flag exclusively.
        synonyms:
          - near-threshold
          - structuring flag
      - name: IS_CROSS_BORDER
        expr: IS_CROSS_BORDER
        data_type: BOOLEAN
        description: TRUE when originator and beneficiary countries differ.
        synonyms:
          - cross border
          - international
      - name: IS_ALERT_LINKED
        expr: IS_ALERT_LINKED
        data_type: BOOLEAN
        description: TRUE if this transaction is evidentially linked to at least one alert (any status).
      - name: IS_ALERT_LINKED_ACTIVE
        expr: IS_ALERT_LINKED_ACTIVE
        data_type: BOOLEAN
        description: >-
          TRUE if linked to at least one alert in OPEN or ESCALATED status. This is
          the filter used by total_suspicious_transaction_volume_usd — only transactions
          linked to currently active alerts count as suspicious. Historically closed
          alerts (including CLOSED_SAR_FILED) are excluded because the volume metric
          measures current exposure, not historical.
        synonyms:
          - suspicious
          - flagged
          - linked to active alert
      - name: REPORTING_ENTITY_JURISDICTION
        expr: REPORTING_ENTITY_JURISDICTION
        data_type: VARCHAR
        description: "Jurisdiction of the branch that booked this transaction (AU or SG). Used for jurisdiction-scoped reporting."
        synonyms:
          - jurisdiction
          - booking jurisdiction
      - name: NET_DIRECTION
        expr: NET_DIRECTION
        data_type: VARCHAR
        description: "Simplified direction: INFLOW, OUTFLOW, or INTERNAL."
      - name: COUNTERPARTY_NAME
        expr: COUNTERPARTY_NAME
        data_type: VARCHAR
        description: Denormalized counterparty legal name.
      - name: COUNTERPARTY_RISK_RATING
        expr: COUNTERPARTY_RISK_RATING
        data_type: VARCHAR
        description: Denormalized risk rating of the counterparty.
      - name: COUNTERPARTY_JURISDICTION
        expr: COUNTERPARTY_JURISDICTION
        data_type: VARCHAR
        description: Denormalized counterparty booking jurisdiction.
      - name: LINKED_ALERT_MAX_SEVERITY
        expr: LINKED_ALERT_MAX_SEVERITY
        data_type: VARCHAR
        description: "Highest severity among linked alerts (CRITICAL > HIGH > MEDIUM > LOW). NULL if not alert-linked."
    time_dimensions:
      - name: VALUE_DATE
        expr: VALUE_DATE
        data_type: DATE
        description: >-
          Settlement / value date. This is the GOVERNED DATE BASIS for transaction
          reporting — all date-filtered metrics on transactions use VALUE_DATE, not
          booking_date or transaction_timestamp. This prevents cross-period
          discrepancies from booking-vs-settlement timing differences.
        synonyms:
          - transaction date
          - date
          - settlement date
      - name: BOOKING_DATE
        expr: BOOKING_DATE
        data_type: DATE
        description: Date the transaction was booked (may differ from value_date at period boundaries).
      - name: TRANSACTION_TIMESTAMP
        expr: TRANSACTION_TIMESTAMP
        data_type: TIMESTAMP_NTZ
        description: Exact timestamp when the transaction was booked.
    facts:
      - name: AMOUNT_USD
        expr: AMOUNT_USD
        data_type: NUMBER
        description: >-
          Transaction amount in USD. Always positive — direction is determined by
          transaction_type (WIRE_IN = inflow, WIRE_OUT = outflow, etc.). Used as the
          basis for total_suspicious_transaction_volume_usd after applying governance
          filters (settled only, non-reversal, active-alert-linked).
        synonyms:
          - amount
          - value
          - transaction amount
          - volume
        default_aggregation: sum
      - name: LINKED_ALERT_COUNT
        expr: LINKED_ALERT_COUNT
        data_type: NUMBER
        description: Number of distinct alerts this transaction is linked to.
        default_aggregation: sum
    metrics:
      - name: TOTAL_SUSPICIOUS_TRANSACTION_VOLUME_USD
        expr: "SUM(CASE WHEN IS_ALERT_LINKED_ACTIVE = TRUE AND IS_REVERSAL = FALSE AND IS_SETTLED = TRUE THEN AMOUNT_USD ELSE 0 END)"
        data_type: NUMBER
        description: >-
          Total USD value of transactions linked to currently OPEN or ESCALATED
          alerts, excluding reversals and unsettled transactions.
          Governance decisions encoded: (1) Date basis is VALUE_DATE (settlement),
          not booking_date — a date filter on this metric filters on settlement date
          to prevent cross-period discrepancies. (2) Reversals excluded (IS_REVERSAL
          = FALSE) to avoid double-counting the economic event. (3) Only SETTLED
          transactions — PENDING may never clear and should not inflate the risk
          figure presented to the board. (4) Only OPEN and ESCALATED alerts — closed
          alerts (including CLOSED_SAR_FILED) are excluded because this metric
          measures current suspicious exposure, not historical.
          Regulatory basis: STR Filing Guidance section 3.1 — volume determines
          whether threshold reporting is triggered.
        synonyms:
          - suspicious volume
          - suspicious transaction volume
          - flagged volume
          - suspicious amount
          - total suspicious volume
        default_aggregation: sum
      - name: STRUCTURING_INDICATOR_SCORE
        expr: "ROUND(COUNT(CASE WHEN TRANSACTION_TYPE = 'CASH_DEPOSIT' AND AMOUNT_USD BETWEEN 8000 AND 9999 THEN 1 END) * 100.0 / NULLIF(COUNT(CASE WHEN TRANSACTION_TYPE = 'CASH_DEPOSIT' THEN 1 END), 0), 2)"
        data_type: NUMBER
        description: >-
          Percentage of cash deposits that fall in the $8,000-$9,999 structuring band
          (just below the $10,000 AUSTRAC reporting threshold), scaled 0-100.
          Governance decisions encoded: (1) Band is $8,000 to $9,999 — not $9,000-$9,999
          (too narrow, misses split deposits) and not $5,000-$9,999 (too broad,
          excessive false positives). (2) Denominator is all CASH_DEPOSIT transactions
          only — other transaction types are excluded. (3) Lookback window should be
          applied via date filter on VALUE_DATE. (4) Only transaction_type =
          CASH_DEPOSIT counts — money orders and other cash-equivalents are excluded
          for consistency. Returns NULL when there are no cash deposits (avoids
          division by zero).
          Regulatory basis: AML/CTF Policy section 5.2 — structuring detection.
          Threshold avoidance is a prescribed typology under AUSTRAC.
        synonyms:
          - structuring score
          - structuring indicator
          - smurfing score
          - threshold avoidance score
        default_aggregation: avg

  # ================================================================
  # FACT_ALERT — alert fact
  # ================================================================
  - name: FACT_ALERT
    description: >-
      One row per alert generated by the transaction monitoring system. Tracks the
      alert lifecycle from OPEN through disposition (CLOSED_NO_ACTION or
      CLOSED_SAR_FILED) or escalation. The alert_closure_rate metric on this table
      is COHORT-based: it measures what fraction of alerts opened in a period have
      been closed, not what fraction of closures occurred in a period. This is the
      harder but more honest measure of operational throughput.
    synonyms:
      - alert
      - alerts
      - detection
      - detections
    base_table:
      database: PAPERTRAIL
      schema: GOLD
      table: FACT_ALERT
    primary_key:
      columns:
        - ALERT_ID
    dimensions:
      - name: ALERT_ID
        expr: ALERT_ID
        data_type: VARCHAR
        description: Unique alert identifier.
        unique: true
      - name: COUNTERPARTY_ID
        expr: COUNTERPARTY_ID
        data_type: VARCHAR
        description: FK to the counterparty who is the primary subject of this alert.
      - name: RULE_ID
        expr: RULE_ID
        data_type: VARCHAR
        description: Identifier of the detection rule that fired.
      - name: RULE_NAME
        expr: RULE_NAME
        data_type: VARCHAR
        description: Human-readable name of the detection rule.
        synonyms:
          - detection rule
      - name: TYPOLOGY
        expr: TYPOLOGY
        data_type: VARCHAR
        description: "AML typology category: STRUCTURING, RAPID_MOVEMENT, DORMANT_REACTIVATION, SANCTIONS_NEAR_MATCH, VELOCITY_SPIKE, or ROUND_TRIPPING."
        synonyms:
          - alert type
          - pattern
          - risk type
      - name: SEVERITY
        expr: SEVERITY
        data_type: VARCHAR
        description: "Alert severity: LOW, MEDIUM, HIGH, or CRITICAL."
        synonyms:
          - alert severity
          - risk level
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
        description: "Alert lifecycle status: OPEN, ESCALATED, CLOSED_NO_ACTION, or CLOSED_SAR_FILED."
        synonyms:
          - alert status
          - disposition
      - name: ASSIGNED_ANALYST_ID
        expr: ASSIGNED_ANALYST_ID
        data_type: VARCHAR
        description: Identifier of the compliance analyst assigned to review this alert.
      - name: JURISDICTION
        expr: JURISDICTION
        data_type: VARCHAR
        description: Jurisdiction of the alert (AU or SG).
      - name: IS_OPEN
        expr: IS_OPEN
        data_type: BOOLEAN
        description: TRUE if alert status is OPEN.
      - name: IS_ESCALATED
        expr: IS_ESCALATED
        data_type: BOOLEAN
        description: TRUE if alert status is ESCALATED.
      - name: IS_CLOSED
        expr: IS_CLOSED
        data_type: BOOLEAN
        description: "TRUE if alert has a terminal closed status (CLOSED_NO_ACTION or CLOSED_SAR_FILED)."
      - name: IS_SAR_FILED
        expr: IS_SAR_FILED
        data_type: BOOLEAN
        description: TRUE if the alert was closed with a SAR/STR filing.
      - name: IS_ACTIVE
        expr: IS_ACTIVE
        data_type: BOOLEAN
        description: TRUE if the alert is OPEN or ESCALATED (not yet closed).
      - name: COUNTERPARTY_NAME
        expr: COUNTERPARTY_NAME
        data_type: VARCHAR
        description: Denormalized counterparty legal name.
      - name: COUNTERPARTY_RISK_RATING
        expr: COUNTERPARTY_RISK_RATING
        data_type: VARCHAR
        description: Denormalized risk rating.
      - name: LINKED_CASE_ID
        expr: LINKED_CASE_ID
        data_type: VARCHAR
        description: Case ID if this alert was escalated to an investigation. NULL if not escalated.
      - name: LINKED_CASE_STATUS
        expr: LINKED_CASE_STATUS
        data_type: VARCHAR
        description: Status of the linked case, if any.
    time_dimensions:
      - name: ALERT_DATE
        expr: ALERT_DATE
        data_type: DATE
        description: >-
          Date the detection rule fired. This is the governed date basis for
          alert_closure_rate — the cohort is defined by when alerts were OPENED,
          not when they were closed.
        synonyms:
          - date
          - detection date
      - name: ALERT_TIMESTAMP
        expr: ALERT_TIMESTAMP
        data_type: TIMESTAMP_NTZ
        description: Exact timestamp when the alert was generated.
      - name: COHORT_MONTH
        expr: COHORT_MONTH
        data_type: DATE
        description: "Month in which this alert was opened (DATE_TRUNC of alert_date). Used for cohort-based time-series aggregation."
        synonyms:
          - month
          - alert month
    facts:
      - name: LINKED_TRANSACTION_COUNT
        expr: LINKED_TRANSACTION_COUNT
        data_type: NUMBER
        description: Number of transactions evidentially linked to this alert.
        default_aggregation: sum
      - name: LINKED_TRANSACTION_AMOUNT_USD
        expr: LINKED_TRANSACTION_AMOUNT_USD
        data_type: NUMBER
        description: Total USD amount across all transactions linked to this alert.
        synonyms:
          - alert amount
          - flagged amount
        default_aggregation: sum
    metrics:
      - name: ALERT_CLOSURE_RATE
        expr: "ROUND(COUNT(CASE WHEN STATUS LIKE 'CLOSED%' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2)"
        data_type: NUMBER
        description: >-
          Percentage of alerts that have been closed (any disposition) out of all
          alerts in the filtered set. Governance decisions encoded: (1) COHORT-based,
          not snapshot — the denominator is alerts OPENED in the period, and the
          numerator is how many of those have since been closed. This is harder on
          the team than a snapshot measure (which counts closures regardless of when
          opened) but gives a true picture of backlog clearance. (2) All closed
          statuses count (CLOSED_NO_ACTION and CLOSED_SAR_FILED) — both are terminal
          dispositions. ESCALATED is NOT counted as closed. (3) Auto-closed
          below-threshold alerts are included in both numerator and denominator; they
          are legitimate closures per monitoring policy. (4) Date filter applies to
          ALERT_DATE (when the alert was opened), not when it was closed.
          Regulatory basis: AML/CTF Policy section 7.3 — monitoring effectiveness.
          Rate below target triggers enhanced monitoring review.
        synonyms:
          - closure rate
          - alert resolution rate
          - close rate
        default_aggregation: avg

  # ================================================================
  # FACT_CASE — investigation case fact
  # ================================================================
  - name: FACT_CASE
    description: >-
      One row per investigation case opened by a compliance analyst, grouping one
      or more alerts for a single counterparty. Tracks the decision lifecycle from
      OPEN through terminal status (SAR_FILED or CLOSED_NO_ACTION). The
      sar_filing_rate metric uses ALL cases opened in a period as denominator —
      including those still OPEN or UNDER_REVIEW — because excluding undecided
      cases would artificially inflate the rate.
    synonyms:
      - case
      - cases
      - investigation
      - investigations
    base_table:
      database: PAPERTRAIL
      schema: GOLD
      table: FACT_CASE
    primary_key:
      columns:
        - CASE_ID
    dimensions:
      - name: CASE_ID
        expr: CASE_ID
        data_type: VARCHAR
        description: Unique investigation case identifier.
        unique: true
      - name: COUNTERPARTY_ID
        expr: COUNTERPARTY_ID
        data_type: VARCHAR
        description: FK to the counterparty under investigation.
      - name: STATUS
        expr: STATUS
        data_type: VARCHAR
        description: "Case lifecycle status: OPEN, UNDER_REVIEW, ESCALATED_TO_MLRO, SAR_FILED, or CLOSED_NO_ACTION."
        synonyms:
          - case status
          - investigation status
      - name: PRIORITY
        expr: PRIORITY
        data_type: VARCHAR
        description: "Case priority: ROUTINE, URGENT, or CRITICAL."
      - name: ASSIGNED_ANALYST_ID
        expr: ASSIGNED_ANALYST_ID
        data_type: VARCHAR
        description: Compliance analyst assigned to this case.
      - name: JURISDICTION
        expr: JURISDICTION
        data_type: VARCHAR
        description: Jurisdiction of the case (AU or SG).
      - name: IS_TERMINAL
        expr: IS_TERMINAL
        data_type: BOOLEAN
        description: "TRUE if case has reached a final disposition: SAR_FILED or CLOSED_NO_ACTION. ESCALATED_TO_MLRO is NOT terminal."
      - name: IS_SAR_FILED
        expr: IS_SAR_FILED
        data_type: BOOLEAN
        description: TRUE if the case resulted in a SAR/STR filing.
        synonyms:
          - SAR filed
          - STR filed
      - name: IS_CLOSED_NO_ACTION
        expr: IS_CLOSED_NO_ACTION
        data_type: BOOLEAN
        description: TRUE if the case was closed with no regulatory action required.
      - name: IS_OPEN
        expr: IS_OPEN
        data_type: BOOLEAN
        description: TRUE if case status is OPEN or UNDER_REVIEW.
      - name: IS_ESCALATED
        expr: IS_ESCALATED
        data_type: BOOLEAN
        description: TRUE if case is ESCALATED_TO_MLRO.
      - name: COUNTERPARTY_NAME
        expr: COUNTERPARTY_NAME
        data_type: VARCHAR
        description: Denormalized counterparty legal name.
      - name: COUNTERPARTY_RISK_RATING
        expr: COUNTERPARTY_RISK_RATING
        data_type: VARCHAR
        description: Denormalized risk rating.
      - name: COUNTERPARTY_JURISDICTION
        expr: COUNTERPARTY_JURISDICTION
        data_type: VARCHAR
        description: Denormalized counterparty booking jurisdiction.
    time_dimensions:
      - name: OPENED_DATE
        expr: OPENED_DATE
        data_type: DATE
        description: >-
          Date the investigation case was opened. This is the governed date basis
          for sar_filing_rate — the cohort is defined by when cases were OPENED.
        synonyms:
          - date
          - case opened date
          - investigation date
      - name: CLOSED_DATE
        expr: CLOSED_DATE
        data_type: DATE
        description: Date the case received a terminal status. NULL if still open.
      - name: COHORT_MONTH
        expr: COHORT_MONTH
        data_type: DATE
        description: Month the case was opened. Used for cohort-based time-series analysis.
        synonyms:
          - month
          - case month
    facts:
      - name: DAYS_TO_RESOLUTION
        expr: DAYS_TO_RESOLUTION
        data_type: NUMBER
        description: >-
          Calendar days between opened_date and closed_date. NULL for cases not yet
          closed. This is the governed measure for days_to_case_resolution — uses
          calendar days (not business days) because regulatory SLA timelines
          (e.g. 90-day MLRO escalation threshold) are specified in calendar days.
          Only populated for terminal cases (SAR_FILED or CLOSED_NO_ACTION).
          ESCALATED_TO_MLRO is NOT treated as terminal.
        synonyms:
          - resolution time
          - case duration
          - time to resolve
        default_aggregation: avg
      - name: LINKED_ALERT_COUNT
        expr: LINKED_ALERT_COUNT
        data_type: NUMBER
        description: Number of alerts grouped into this investigation case.
        default_aggregation: sum
    metrics:
      - name: SAR_FILING_RATE
        expr: "ROUND(COUNT(CASE WHEN STATUS = 'SAR_FILED' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2)"
        data_type: NUMBER
        description: >-
          Percentage of investigation cases that resulted in a SAR/STR filing.
          Governance decisions encoded: (1) Denominator includes ALL cases opened in
          the period — including those still OPEN or UNDER_REVIEW. Excluding undecided
          cases (as some analysts do) artificially inflates the rate, which is misleading
          when a regulator asks "what is your SAR rate?". (2) Each case counts at most
          once — supplemental filings on the same case do not inflate the numerator.
          (3) Date filter applies to OPENED_DATE (when the case was opened), not when
          the SAR was filed, because this is a cohort measure of investigation outcomes.
          (4) ESCALATED_TO_MLRO is not counted as SAR_FILED — only the explicit
          SAR_FILED status counts.
          Regulatory basis: STR Filing Guidance section 4.1 — filing rate expectations.
          An abnormally low rate is a regulatory red flag.
        synonyms:
          - SAR rate
          - filing rate
          - STR rate
          - suspicious activity report rate
        default_aggregation: avg
      - name: DAYS_TO_CASE_RESOLUTION
        expr: "AVG(CASE WHEN IS_TERMINAL = TRUE THEN DAYS_TO_RESOLUTION END)"
        data_type: NUMBER
        description: >-
          Average calendar days from case opening to terminal disposition (SAR_FILED
          or CLOSED_NO_ACTION). Governance decisions encoded: (1) Calendar days, not
          business days — regulatory SLA timelines are in calendar days, and using
          business days would make performance look better than the regulator measures
          it. (2) Only terminal cases are included (IS_TERMINAL = TRUE). Cases still
          OPEN, UNDER_REVIEW, or ESCALATED_TO_MLRO are excluded from the average
          because they have no resolution date. (3) ESCALATED_TO_MLRO is NOT treated
          as resolved — the analyst passed it upward, but the case is not done.
          (4) Re-opened cases are not modeled — a closed case stays closed; if rework
          is needed, a new case is created.
          Regulatory basis: AML/CTF Policy section 7.5 — cases open more than 90
          calendar days require MLRO escalation.
        synonyms:
          - average resolution days
          - case resolution time
          - investigation duration
          - time to close
        default_aggregation: avg

# ================================================================
# Relationships
# ================================================================
relationships:
  - name: account_to_counterparty
    left_table: DIM_ACCOUNT
    right_table: DIM_COUNTERPARTY
    relationship_columns:
      - left_column: COUNTERPARTY_ID
        right_column: COUNTERPARTY_ID
    join_type: many_to_one
    description: Each account belongs to one counterparty.

  - name: transaction_to_counterparty
    left_table: FACT_TRANSACTION
    right_table: DIM_COUNTERPARTY
    relationship_columns:
      - left_column: COUNTERPARTY_ID
        right_column: COUNTERPARTY_ID
    join_type: many_to_one
    description: Each transaction belongs to one counterparty.

  - name: alert_to_counterparty
    left_table: FACT_ALERT
    right_table: DIM_COUNTERPARTY
    relationship_columns:
      - left_column: COUNTERPARTY_ID
        right_column: COUNTERPARTY_ID
    join_type: many_to_one
    description: Each alert is raised against one counterparty.

  - name: case_to_counterparty
    left_table: FACT_CASE
    right_table: DIM_COUNTERPARTY
    relationship_columns:
      - left_column: COUNTERPARTY_ID
        right_column: COUNTERPARTY_ID
    join_type: many_to_one
    description: Each investigation case concerns one counterparty.

# ================================================================
# Verified Queries
# ================================================================
verified_queries:
  # --- Metric 1: total_suspicious_transaction_volume_usd ---
  - name: suspicious_volume_last_quarter
    question: What was our total suspicious transaction volume last quarter?
    sql: >-
      SELECT
        SUM(CASE WHEN ft.IS_ALERT_LINKED_ACTIVE = TRUE
                  AND ft.IS_REVERSAL = FALSE
                  AND ft.IS_SETTLED = TRUE
             THEN ft.AMOUNT_USD ELSE 0 END) AS total_suspicious_transaction_volume_usd
      FROM PAPERTRAIL.GOLD.FACT_TRANSACTION ft
      WHERE ft.VALUE_DATE >= DATE_TRUNC('QUARTER', DATEADD('QUARTER', -1, CURRENT_DATE()))
        AND ft.VALUE_DATE < DATE_TRUNC('QUARTER', CURRENT_DATE())
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  - name: suspicious_volume_by_jurisdiction
    question: What is the suspicious transaction volume by jurisdiction?
    sql: >-
      SELECT
        ft.REPORTING_ENTITY_JURISDICTION AS jurisdiction,
        SUM(CASE WHEN ft.IS_ALERT_LINKED_ACTIVE = TRUE
                  AND ft.IS_REVERSAL = FALSE
                  AND ft.IS_SETTLED = TRUE
             THEN ft.AMOUNT_USD ELSE 0 END) AS total_suspicious_transaction_volume_usd
      FROM PAPERTRAIL.GOLD.FACT_TRANSACTION ft
      GROUP BY ft.REPORTING_ENTITY_JURISDICTION
      ORDER BY total_suspicious_transaction_volume_usd DESC
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 2: counterparty_exposure_usd ---
  - name: top_exposure_counterparties
    question: Which counterparties have the highest exposure?
    sql: >-
      SELECT
        dc.COUNTERPARTY_ID,
        dc.FULL_LEGAL_NAME,
        dc.RISK_RATING,
        dc.JURISDICTION,
        dc.RESOLVED_EXPOSURE_USD AS counterparty_exposure_usd
      FROM PAPERTRAIL.GOLD.DIM_COUNTERPARTY dc
      WHERE dc.ACTIVE_ACCOUNT_COUNT > 0
      ORDER BY dc.RESOLVED_EXPOSURE_USD DESC
      LIMIT 20
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 3: alert_closure_rate ---
  - name: alert_closure_rate_this_year
    question: What is our alert closure rate this year?
    sql: >-
      SELECT
        ROUND(
          COUNT(CASE WHEN fa.STATUS LIKE 'CLOSED%' THEN 1 END) * 100.0
          / NULLIF(COUNT(*), 0),
        2) AS alert_closure_rate
      FROM PAPERTRAIL.GOLD.FACT_ALERT fa
      WHERE fa.ALERT_DATE >= DATE_TRUNC('YEAR', CURRENT_DATE())
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  - name: alert_closure_rate_by_typology
    question: What is the alert closure rate by typology this year?
    sql: >-
      SELECT
        fa.TYPOLOGY,
        COUNT(*) AS total_alerts,
        COUNT(CASE WHEN fa.STATUS LIKE 'CLOSED%' THEN 1 END) AS closed_alerts,
        ROUND(
          COUNT(CASE WHEN fa.STATUS LIKE 'CLOSED%' THEN 1 END) * 100.0
          / NULLIF(COUNT(*), 0),
        2) AS alert_closure_rate
      FROM PAPERTRAIL.GOLD.FACT_ALERT fa
      WHERE fa.ALERT_DATE >= DATE_TRUNC('YEAR', CURRENT_DATE())
      GROUP BY fa.TYPOLOGY
      ORDER BY alert_closure_rate ASC
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 4: sar_filing_rate ---
  - name: sar_filing_rate_this_year
    question: What share of cases resulted in a SAR filing?
    sql: >-
      SELECT
        ROUND(
          COUNT(CASE WHEN fc.STATUS = 'SAR_FILED' THEN 1 END) * 100.0
          / NULLIF(COUNT(*), 0),
        2) AS sar_filing_rate
      FROM PAPERTRAIL.GOLD.FACT_CASE fc
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 5: structuring_indicator_score ---
  - name: structuring_score_by_counterparty
    question: Which counterparties have the highest structuring indicator scores in the last 90 days?
    sql: >-
      SELECT
        ft.COUNTERPARTY_ID,
        ft.COUNTERPARTY_NAME,
        COUNT(CASE WHEN ft.TRANSACTION_TYPE = 'CASH_DEPOSIT' THEN 1 END) AS total_cash_deposits,
        COUNT(CASE WHEN ft.TRANSACTION_TYPE = 'CASH_DEPOSIT'
                    AND ft.AMOUNT_USD BETWEEN 8000 AND 9999 THEN 1 END) AS structuring_band_deposits,
        ROUND(
          COUNT(CASE WHEN ft.TRANSACTION_TYPE = 'CASH_DEPOSIT'
                      AND ft.AMOUNT_USD BETWEEN 8000 AND 9999 THEN 1 END) * 100.0
          / NULLIF(COUNT(CASE WHEN ft.TRANSACTION_TYPE = 'CASH_DEPOSIT' THEN 1 END), 0),
        2) AS structuring_indicator_score
      FROM PAPERTRAIL.GOLD.FACT_TRANSACTION ft
      WHERE ft.VALUE_DATE >= DATEADD('DAY', -90, CURRENT_DATE())
        AND ft.IS_REVERSAL = FALSE
        AND ft.IS_SETTLED = TRUE
      GROUP BY ft.COUNTERPARTY_ID, ft.COUNTERPARTY_NAME
      HAVING COUNT(CASE WHEN ft.TRANSACTION_TYPE = 'CASH_DEPOSIT' THEN 1 END) > 0
      ORDER BY structuring_indicator_score DESC
      LIMIT 20
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 6: days_to_case_resolution ---
  - name: avg_case_resolution_time
    question: What is the average days to case resolution?
    sql: >-
      SELECT
        ROUND(AVG(fc.DAYS_TO_RESOLUTION), 1) AS days_to_case_resolution
      FROM PAPERTRAIL.GOLD.FACT_CASE fc
      WHERE fc.IS_TERMINAL = TRUE
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Metric 7: high_risk_counterparty_count ---
  - name: high_risk_counterparties_by_jurisdiction
    question: How many high risk counterparties do we have in Singapore?
    sql: >-
      SELECT
        COUNT(DISTINCT dc.COUNTERPARTY_ID) AS high_risk_counterparty_count
      FROM PAPERTRAIL.GOLD.DIM_COUNTERPARTY dc
      WHERE dc.IS_HIGH_RISK = TRUE
        AND dc.JURISDICTION = 'SG'
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team

  # --- Multi-metric question ---
  - name: risk_dashboard_by_jurisdiction
    question: Show me the total suspicious volume, alert closure rate, and SAR filing rate by jurisdiction.
    sql: >-
      SELECT
        j.jurisdiction,
        COALESCE(t.total_suspicious_transaction_volume_usd, 0) AS total_suspicious_transaction_volume_usd,
        COALESCE(a.alert_closure_rate, 0) AS alert_closure_rate,
        COALESCE(c.sar_filing_rate, 0) AS sar_filing_rate
      FROM (SELECT 'AU' AS jurisdiction UNION ALL SELECT 'SG') j
      LEFT JOIN (
        SELECT ft.REPORTING_ENTITY_JURISDICTION AS jurisdiction,
               SUM(CASE WHEN ft.IS_ALERT_LINKED_ACTIVE = TRUE
                         AND ft.IS_REVERSAL = FALSE
                         AND ft.IS_SETTLED = TRUE
                    THEN ft.AMOUNT_USD ELSE 0 END) AS total_suspicious_transaction_volume_usd
        FROM PAPERTRAIL.GOLD.FACT_TRANSACTION ft
        GROUP BY ft.REPORTING_ENTITY_JURISDICTION
      ) t ON j.jurisdiction = t.jurisdiction
      LEFT JOIN (
        SELECT fa.JURISDICTION,
               ROUND(COUNT(CASE WHEN fa.STATUS LIKE 'CLOSED%' THEN 1 END) * 100.0
                     / NULLIF(COUNT(*), 0), 2) AS alert_closure_rate
        FROM PAPERTRAIL.GOLD.FACT_ALERT fa
        GROUP BY fa.JURISDICTION
      ) a ON j.jurisdiction = a.jurisdiction
      LEFT JOIN (
        SELECT fc.JURISDICTION,
               ROUND(COUNT(CASE WHEN fc.STATUS = 'SAR_FILED' THEN 1 END) * 100.0
                     / NULLIF(COUNT(*), 0), 2) AS sar_filing_rate
        FROM PAPERTRAIL.GOLD.FACT_CASE fc
        GROUP BY fc.JURISDICTION
      ) c ON j.jurisdiction = c.jurisdiction
      ORDER BY j.jurisdiction
    verified_at: 1727740800
    verified_by: PaperTrail Governance Team
